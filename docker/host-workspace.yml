# High-trust host workspace access. Enable only when the Ulises agent should
# work on a host directory outside the container's normal /app/data sandbox.
#   COMPOSE_FILE=docker-compose.yml:docker/host-workspace.yml
#   ULISES_HOST_WORKSPACE_DIR=/absolute/host/path
#   ULISES_HOST_WORKSPACE_MOUNT=/host/workspace
services:
  ulises:
    volumes:
      - ${ULISES_HOST_WORKSPACE_DIR:?set ULISES_HOST_WORKSPACE_DIR}:${ULISES_HOST_WORKSPACE_MOUNT:-/host/workspace}:rw,z
    environment:
      - ULISES_HOST_WORKSPACE_MOUNT=${ULISES_HOST_WORKSPACE_MOUNT:-/host/workspace}
